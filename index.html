<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뿌뿌1111</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 16px;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f6f3ee;
      color: #2b2b2b;
    }

    h1 {
      text-align: center;
      margin: 0 0 32px;
      font-size: 2rem;
    }

    #cards {
      list-style: none;
      margin: 0 auto;
      padding: 0;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .card {
      background: #fffdf7;
      border: 1px solid #e4ddd0;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .card .name {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: #8a5a2b;
    }

    .card .message {
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>우리 반 방명록</h1>

  <ul id="cards">
    <!-- 카드 -->
    <li class="card">
      <span class="name">A</span>
      <p class="message">우리 반 모두 반가워! 올해도 잘 지내보자 😊</p>
    </li>
    <!-- 카드 -->
  </ul>
</body>
</html>
